<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OUT1015 Demo Steps</title>
<meta name="description" content="Console actions and copy-ready policies for the OUT1015 instructor demos.">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f7f6f3;--panel:#ffffff;--ink:#1d1b18;--quiet:#5f5a52;--line:#e2ddd4;
  --accent:#b8462f;--accent-ink:#ffffff;--code-bg:#1f2328;--code-ink:#e8e6e1;
  --ok:#2e7d4f;--ok-bg:#e7f3ec;--who-i:#2f5d8a;--who-a:#8a4b2f;--who-m:#5a4b8a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b;--panel:#1e2125;--ink:#ecebe7;--quiet:#a9a49b;--line:#30343a;
    --accent:#e0775f;--accent-ink:#16181b;--code-bg:#0f1114;--code-ink:#e8e6e1;
    --ok:#7cc79a;--ok-bg:#1f2e25;--who-i:#8fb6dc;--who-a:#e0a07f;--who-m:#b3a6e6;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b;--panel:#1e2125;--ink:#ecebe7;--quiet:#a9a49b;--line:#30343a;
  --accent:#e0775f;--accent-ink:#16181b;--code-bg:#0f1114;--code-ink:#e8e6e1;
  --ok:#7cc79a;--ok-bg:#1f2e25;--who-i:#8fb6dc;--who-a:#e0a07f;--who-m:#b3a6e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1;min-width:180px}
.tools{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:14px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0 0;scrollbar-width:thin}
nav button{border:1px solid var(--line);border-bottom:none;background:transparent;color:var(--quiet);border-radius:8px 8px 0 0;padding:7px 12px;white-space:nowrap;font-size:14px}
nav button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;border-color:var(--line)}
main{max-width:860px;margin:0 auto;padding:16px}
section{display:none}
section.on{display:block}
.meta{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;color:var(--quiet);font-size:15px}
.meta b{color:var(--ink)}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px 52px;margin-bottom:10px;position:relative}
ol.steps>li::before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
ol.steps>li.done{opacity:.55}
ol.steps>li.done::before{content:"✓";background:var(--ok)}
.tick{position:absolute;right:12px;top:10px;width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
.who{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.w-i{color:var(--who-i)}.w-a{color:var(--who-a)}.w-m{color:var(--who-m)}
.do{padding-right:28px}
.path{font-weight:600}
.expect{margin-top:8px;background:var(--ok-bg);color:var(--ink);border-left:3px solid var(--ok);border-radius:6px;padding:6px 10px;font-size:15px}
.say{margin-top:6px;color:var(--quiet);font-style:italic;font-size:15px}
.code{position:relative;margin-top:8px}
.code pre{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:10px 74px 10px 12px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.code .lbl{font-size:12px;color:var(--quiet);margin-bottom:3px;font-weight:600}
.copy{position:absolute;right:6px;bottom:6px;border:none;border-radius:6px;padding:4px 10px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600}
.copy.ok{background:var(--ok)}
table{border-collapse:collapse;width:100%;margin-top:8px;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
td code,p code,li code,.do code{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.vals{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.vals label{font-size:14px;color:var(--quiet)}
.vals input{width:100%;font:15px ui-monospace,Menlo,Consolas,monospace;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.note{font-size:14px;color:var(--quiet);margin:4px 0 0}
h2{font-size:17px;margin:18px 0 8px}
details.hook{background:var(--panel);border:1px dashed var(--accent);border-radius:10px;margin-bottom:14px}
details.hook>summary{list-style:none;cursor:pointer;padding:10px 14px;font-weight:600;display:flex;align-items:center;gap:10px}
details.hook>summary::-webkit-details-marker{display:none}
details.hook>summary .hb{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--ink);background:var(--bg)}
details.hook>summary .hb::after{content:"Show"}
details.hook[open]>summary .hb::after{content:"Hide"}
.hook-body{padding:0 16px 12px;font-size:15px}
.hook-body h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:12px 0 4px}
.hook-body p{margin:4px 0}
.hook-body .line{border-left:3px solid var(--accent);padding-left:10px;margin:6px 0}
.hook-body .cue{color:var(--quiet);font-style:italic;font-size:14px}
</style>

<style>
#gate{max-width:420px;margin:12vh auto;padding:0 16px;text-align:center}
#gate h2{font-size:20px;margin:0 0 6px}
#gate p{color:var(--quiet);margin:0 0 16px}
#gate form{display:flex;gap:8px}
#gate input{flex:1;font:18px ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
#gate button{border:none;border-radius:8px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
#gate .err{color:var(--accent);min-height:22px;margin-top:10px;font-size:14px}
body.locked header{display:none}
</style>
</head>

function init(){
  var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  // theme
  var saved=store.get('out1015-theme'); if(saved) document.documentElement.setAttribute('data-theme',saved);
  document.getElementById('theme').onclick=function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur?cur==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark'; document.documentElement.setAttribute('data-theme',next); store.set('out1015-theme',next);
  };
  // tabs
  var secs=[].slice.call(document.querySelectorAll('section')), nav=document.getElementById('tabs');
  secs.forEach(function(s,i){
    var b=document.createElement('button'); b.textContent=s.dataset.tab; b.setAttribute('role','tab');
    b.onclick=function(){show(i)}; nav.appendChild(b);
  });
  function show(i){
    secs.forEach(function(s,j){s.classList.toggle('on',i===j); nav.children[j].setAttribute('aria-selected',i===j)});
    store.set('out1015-tab',String(i)); window.scrollTo(0,0);
  }
  var t=parseInt(store.get('out1015-tab')||'0',10); show(isNaN(t)||t>=secs.length?0:t);
  // variables
  var pres=[].slice.call(document.querySelectorAll('pre'));
  pres.forEach(function(p){p.dataset.tpl=p.textContent});
  var inputs=[].slice.call(document.querySelectorAll('input[data-var]'));
  function fill(){
    var v={}; inputs.forEach(function(i){v[i.dataset.var]=i.value.trim().replace(/\/+$/,'')});
    pres.forEach(function(p){p.textContent=p.dataset.tpl.replace(/\{\{(\w+)\}\}/g,function(m,k){return v[k]||('<'+k.toLowerCase()+'>')})});
  }
  inputs.forEach(function(i){var s=store.get('out1015-'+i.dataset.var); if(s) i.value=s; i.oninput=function(){store.set('out1015-'+i.dataset.var,i.value); fill()}});
  fill();
  // copy buttons
  document.querySelectorAll('.code').forEach(function(c){
    var b=document.createElement('button'); b.className='copy'; b.textContent='Copy'; c.appendChild(b);
    b.onclick=function(){
      var txt=c.querySelector('pre').textContent;
      function ok(){b.textContent='Copied'; b.classList.add('ok'); setTimeout(function(){b.textContent='Copy'; b.classList.remove('ok')},1200)}
      if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fallback)} else fallback();
      function fallback(){var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy'); ok()}catch(e){} document.body.removeChild(ta)}
    };
  });
  // ticks
  document.querySelectorAll('section').forEach(function(s,si){
    s.querySelectorAll('ol.steps>li').forEach(function(li,i){
      var key='out1015-tick-'+si+'-'+i, cb=document.createElement('input');
      cb.type='checkbox'; cb.className='tick'; cb.title='Done'; cb.checked=store.get(key)==='1'; li.classList.toggle('done',cb.checked);
      cb.onchange=function(){li.classList.toggle('done',cb.checked); store.set(key,cb.checked?'1':'0')};
      li.appendChild(cb);
    });
  });
  // talk-track panels: closed by default, remember open/closed
  document.querySelectorAll('details.hook').forEach(function(d){
    var key='out1015-'+d.id, v=store.get(key); d.open=(v===null||v===undefined)?d.hasAttribute('open'):v==='1';
    d.addEventListener('toggle',function(){store.set(key,d.open?'1':'0')});
  });
  document.getElementById('clear').onclick=function(){
    var s=document.querySelector('section.on');
    s.querySelectorAll('.tick').forEach(function(cb){if(cb.checked){cb.checked=false; cb.onchange()}});
  };
}
(function(){
  var st={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
  function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  async function open(code){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SEALED.salt),iterations:SEALED.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(SEALED.iv)},key,u8(SEALED.data));
    document.querySelector('main').innerHTML=new TextDecoder().decode(plain);
    document.getElementById('gate').remove(); document.body.classList.remove('locked');
    init();
    document.getElementById('lock').onclick=function(){st.del('out1015-code'); location.reload()};
  }
  var err=document.getElementById('gate-err');
  document.getElementById('gate-form').onsubmit=function(e){
    e.preventDefault(); var c=document.getElementById('gate-code').value.trim(); err.textContent='Checking…';
    open(c).then(function(){st.set('out1015-code',c)},function(){err.textContent='That code did not work.'});
  };
  var saved=st.get('out1015-code'); if(saved){open(saved).catch(function(){st.del('out1015-code'); err.textContent=''})}
})();
</script>
